<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <meta name="description" content="Un espace de travail vivant : des rappels visibles, des sujets clairs et une carte orbitale à votre façon.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./cockpit.css">
  <script>if(new URLSearchParams(location.search).get("desktopWidget")==="1")document.documentElement.classList.add("desktop-widget")</script>
  <title>Cockpit Takeover — Votre espace en mouvement</title>
</head>
<body>
  <canvas id="universeCanvas" aria-hidden="true"></canvas>
  <div class="app-shell" id="appShell">
    <header class="topbar">
      <a class="brand" href="#orbit" aria-label="Cockpit Takeover — vue orbitale">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <span><b>COCKPIT</b><small>TAKEOVER / ESPACE PERSONNEL</small></span>
      </a>
      <nav class="main-nav" aria-label="Espace du cockpit">
        <button type="button" data-view="tasks" class="nav-button is-active">Mes planètes</button>
      </nav>
      <div class="top-actions">
        <span id="syncBadge" class="sync-badge" aria-live="polite">Widget non synchronisé</span>
        <button id="syncWidget" class="sync-button" type="button" title="Créer une mise à jour locale pour le widget Windows">Synchroniser le widget</button>
        <a class="download-link" href="https://github.com/CEOMELYXJA/CockpitTakeover/releases/latest" target="_blank" rel="noopener noreferrer">Widget Windows ↗</a>
      </div>
      <button id="mobileMenu" class="mobile-menu" type="button" aria-label="Ouvrir les sections">☰</button>
    </header>

    <main class="workspace">
      <section class="scene-copy" aria-label="État de votre espace">
        <div class="scene-copy-top"><span class="live-indicator"></span><span id="sceneStatus">SYSTÈME CALME · EN ATTENTE DE VOS RAPPELS</span></div>
        <div class="scene-copy-bottom">
          <div><p class="eyebrow">VOTRE ESPACE DE TRAVAIL</p><h1 id="sceneHeading">La carte de votre journée</h1><p id="sceneSubheading">Chaque rappel prend sa place. Rien n’est classé sans vous.</p></div>
          <button id="coreInfo" class="core-info" type="button" aria-label="Voir le détail des rappels en orbite"><span class="core-info-icon">◎</span><span><b id="activeCount">0</b><small>rappel en orbite</small></span><span class="core-info-arrow">↗</span></button>
        </div>
      </section>

      <aside id="controlPanel" class="control-panel" aria-label="Commandes du cockpit">
        <div class="panel-header"><div><p class="eyebrow" id="panelKicker">VUE D’ENSEMBLE</p><h2 id="panelTitle">En orbite</h2></div><button id="panelClose" class="panel-close" type="button" aria-label="Réduire le panneau">⌃</button></div>
        <div id="panelContent" class="panel-content"></div>
      </aside>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <input id="taskImport" type="file" accept=".txt,.md,.markdown,.json,text/plain,application/json" hidden>
  </div>

  <script src="./cockpit.js" defer></script>
  <script>if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js",{scope:"./"}).catch(()=>{}))</script>
</body>
</html>
